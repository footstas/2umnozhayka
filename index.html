<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Космический умножайка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; touch-action: none; overscroll-behavior: none; }
  body { background: #0b0d2a; font-family: 'Comic Sans MS', Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ================= ХОЛСТ (учитываем «чёлку» айфона) =================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth * window.devicePixelRatio;
  H = canvas.height = window.innerHeight * window.devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  W = window.innerWidth; H = window.innerHeight;
}
window.addEventListener('resize', resize); resize();

// ================= ЗВУКИ =================
let audioCtx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume(); // на iOS звук требует «разблокировки» тапом
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const soundShoot = () => beep(880, .08, 'square', .06);
const soundGood  = () => { beep(660, .1); setTimeout(() => beep(880, .15), 100); };
const soundBad   = () => beep(160, .35, 'sawtooth');
const soundWin   = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .25), i * 150));
const soundClick = () => beep(520, .07);

// ================= УРОВНИ =================
const LEVELS = [
  { title: 'Уровень 1', name: 'Учим ×2',        desc: 'Умножение на 2, числа от 1 до 5', mults: [2],    max: 5, count: 5, pass: 4 },
  { title: 'Уровень 2', name: '×2: вся таблица', desc: 'Умножение на 2, числа от 1 до 9', mults: [2],    max: 9, count: 8, pass: 5 },
  { title: 'Уровень 3', name: 'Учим ×3',        desc: 'Умножение на 3, числа от 1 до 5', mults: [3],    max: 5, count: 5, pass: 4 },
  { title: 'Уровень 4', name: '×3: вся таблица', desc: 'Умножение на 3, числа от 1 до 9', mults: [3],    max: 9, count: 8, pass: 5 },
  { title: 'Уровень 5', name: 'Микс! 🔥',        desc: 'Всё вместе: ×2 и ×3, числа 1–9',  mults: [2, 3], max: 9, count: 8, pass: 5 },
];

const SAVE_KEY = 'cosmoShooterProgress';
let progress = { unlocked: 1, stars: LEVELS.map(() => 0) };
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (saved && saved.unlocked) progress = saved;
} catch (e) {}
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {} }

// ================= СОСТОЯНИЕ =================
let state = 'menu';   // menu | intro | play | pause | levelEnd
let levelIdx = 0;
let questions = [], qi = 0, score = 0, streak = 0;
let pauseTimer = 0, introTimer = 0, revealCorrect = false;
let flash = null, bullets = [], parts = [], confs = [];
let buttons = [];
let hoverBtn = null;
let fingerDown = false;

const rocket = { x: 0, y: 0, w: 56, h: 66, speed: 8, flame: 0 };
let targets = [];

const stars = [];
for (let i = 0; i < 60; i++) stars.push({
  x: Math.random(), y: Math.random(), r: Math.random() * 1.5 + .5, tw: Math.random() * 7
});

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// ================= ВОПРОСЫ (без повторов) =================
function buildQuestions(lv) {
  const pairs = [];
  for (let a = 1; a <= lv.max; a++) for (const b of lv.mults) pairs.push([a, b]);
  shuffle(pairs);
  const chosen = pairs.slice(0, Math.min(lv.count, pairs.length));
  return chosen.map(([a, b]) => {
    const answer = a * b;
    const wrongs = new Set();
    while (wrongs.size < 2) {
      const w = answer + (Math.floor(Math.random() * 7) + 2) * (Math.random() < .5 ? -1 : 1);
      if (w > 0 && w !== answer) wrongs.add(w);
    }
    return { text: a + ' × ' + b, answer, options: [answer, ...wrongs].sort(() => Math.random() - .5) };
  });
}

function spawnTargets(q) {
  targets = q.options.map((val, i) => ({
    val, correct: val === q.answer,
    x: W * (0.22 + i * 0.28) + rand(-20, 20),
    y: rand(150, H * 0.4),
    vx: rand(-0.8, 0.8) || 0.6,
    vy: rand(-0.3, 0.3),
    r: Math.min(46, W / 9), wob: Math.random() * 7, hit: false, dim: false
  }));
}

function startLevel(idx) {
  levelIdx = idx;
  const lv = LEVELS[idx];
  questions = buildQuestions(lv);
  qi = 0; score = 0; streak = 0;
  bullets = []; parts = []; confs = []; revealCorrect = false;
  rocket.x = W / 2; rocket.y = H - 110;
  state = 'intro'; introTimer = 110;
}

function nextQuestion() {
  spawnTargets(questions[qi]);
  flash = { text: 'Пример ' + (qi + 1) + ' из ' + LEVELS[levelIdx].count, color: '#ffe66d', life: 70 };
}

// ================= ЭФФЕКТЫ =================
function boom(x, y, color, n) {
  for (let i = 0; i < n; i++) parts.push({
    x, y, vx: rand(-4, 4), vy: rand(-5, 2), r: rand(2, 5), life: rand(30, 60), color
  });
}
function confetti(n) {
  const colors = ['#ff6b6b', '#ffd700', '#4ecdc4', '#a29bfe', '#6ee86e'];
  for (let i = 0; i < n; i++) confs.push({
    x: rand(0, W), y: rand(-60, -10), vy: rand(2, 5), vx: rand(-1.5, 1.5),
    size: rand(6, 11), color: pick(colors), rot: rand(0, 6.28), vr: rand(-.2, .2)
  });
}

function answer(t) {
  t.hit = true;
  const lv = LEVELS[levelIdx];
  if (t.correct) {
    score++; streak++;
    soundGood(); boom(t.x, t.y, '#ffd700', 40);
    flash = { text: pick(['Попадание! 🚀', 'Точно в цель! 🎯', 'Супер! ⭐']), color: '#6ee86e', life: 80 };
    if (streak % 5 === 0) flash = { text: '🔥 СЕРИЯ ' + streak + '! 🔥', color: '#ff9f43', life: 110 };
    confetti(25);
    qi++; state = 'pause'; pauseTimer = 60; revealCorrect = false;
  } else {
    streak = 0;
    soundBad(); boom(t.x, t.y, '#ff5252', 25);
    flash = { text: 'Мимо! ' + t.val + ' — не то 💡', color: '#ff8a8a', life: 130 };
    revealCorrect = true;
    targets.forEach(o => { if (o.correct) o.glow = 1; else o.dim = true; });
    qi++; state = 'pause'; pauseTimer = 150;
  }
}

// ================= УПРАВЛЕНИЕ ПАЛЬЦЕМ =================
function btnHit(x, y) {
  for (const b of buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const b = btnHit(e.clientX, e.clientY);
  if (b) { soundClick(); b.action(); return; }
  if (state === 'play') { fingerDown = true; rocket.x = e.clientX; }
});
canvas.addEventListener('pointermove', e => {
  const b = btnHit(e.clientX, e.clientY);
  hoverBtn = b;
  if (state === 'play' && fingerDown) rocket.x = e.clientX;
});
canvas.addEventListener('pointerup', e => {
  e.preventDefault();
  if (state === 'play' && fingerDown) { shoot(); fingerDown = false; }
});
canvas.addEventListener('pointercancel', () => { fingerDown = false; });
// страховка для старых iOS, где pointer-события капризничают
canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

function shoot() {
  bullets.push({ x: rocket.x, y: rocket.y - rocket.h, vy: -11 });
  soundShoot();
}

// ================= ОБНОВЛЕНИЕ =================
function update() {
  stars.forEach(s => s.tw += .05);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .08; p.life--; });
  parts = parts.filter(p => p.life > 0);
  confs.forEach(c => { c.x += c.vx; c.y += c.vy; c.rot += c.vr; });
  confs = confs.filter(c => c.y < H + 20);
  if (flash) { flash.life--; if (flash.life <= 0) flash = null; }

  if (state === 'intro') {
    introTimer--;
    if (introTimer <= 0) { state = 'play'; nextQuestion(); }
  }

  if (state === 'play') {
    rocket.x = Math.max(rocket.w / 2 + 5, Math.min(W - rocket.w / 2 - 5, rocket.x));
    rocket.flame = 0.8 + Math.sin(Date.now() / 60) * 0.35;

    targets.forEach(t => {
      if (t.hit) return;
      t.x += t.vx; t.y += t.vy; t.wob += .04;
      if (t.x < 60 || t.x > W - 60) t.vx *= -1;
      if (t.y < 130 || t.y > H * 0.5) t.vy *= -1;
      if (t.glow) t.glow = (t.glow + .05) % 2;
    });

    bullets.forEach(b => b.y += b.vy);
    bullets = bullets.filter(b => {
      if (b.y < -20) return false;
      for (const t of targets) {
        if (t.hit) continue;
        if (Math.hypot(b.x - t.x, b.y - t.y) < t.r + 6) { answer(t); return false; }
      }
      return true;
    });
  }

  if (state === 'pause') {
    pauseTimer--;
    targets.forEach(t => { t.x += t.vx * .3; t.wob += .02; if (t.glow) t.glow = (t.glow + .05) % 2; });
    if (pauseTimer <= 0) {
      revealCorrect = false;
      if (qi >= LEVELS[levelIdx].count) endLevel();
      else { state = 'play'; nextQuestion(); }
    }
  }
}

function endLevel() {
  const lv = LEVELS[levelIdx];
  const passed = score >= lv.pass;
  const starsEarned = score === lv.count ? 3 : score > lv.pass ? 2 : score >= lv.pass ? 1 : 0;
  if (passed && starsEarned > progress.stars[levelIdx]) progress.stars[levelIdx] = starsEarned;
  const unlockedNext = passed && levelIdx + 1 < LEVELS.length && progress.unlocked < levelIdx + 2;
  if (unlockedNext) progress.unlocked = levelIdx + 2;
  saveProgress();
  state = 'levelEnd';
  if (passed) { soundWin(); confetti(90); } else soundBad();
}

// ================= РИСОВАНИЕ =================
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawButton(b) {
  const hov = b === hoverBtn && !b.locked;
  ctx.save();
  ctx.globalAlpha = b.locked ? 0.45 : 1;
  ctx.fillStyle = b.locked ? '#444a5a' : (b.color || '#4ecdc4');
  roundRect(b.x, b.y, b.w, b.h, 16); ctx.fill();
  if (hov) { ctx.strokeStyle = '#ffe66d'; ctx.lineWidth = 4; roundRect(b.x, b.y, b.w, b.h, 16); ctx.stroke(); }
  ctx.fillStyle = b.locked ? '#999' : '#fff';
  ctx.font = (b.font || 'bold 22px') + ' "Comic Sans MS", Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  if (b.sub) {
    ctx.fillStyle = b.locked ? '#999' : '#eafffe';
    ctx.font = '14px "Comic Sans MS", Arial';
    ctx.fillText(b.sub, b.x + b.w / 2, b.y + b.h / 2 + 24);
  }
  if (b.stars !== undefined) {
    let s = '';
    for (let i = 0; i < 3; i++) s += i < b.stars ? '⭐' : '☆';
    ctx.fillStyle = '#ffe66d'; ctx.font = '18px Arial';
    ctx.fillText(s, b.x + b.w / 2, b.y + b.h / 2 + 48);
  }
  ctx.restore();
}

function centerText(text, y, size, color, bold) {
  ctx.fillStyle = color;
  ctx.font = (bold ? 'bold ' : '') + size + 'px "Comic Sans MS", Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, y);
}

function draw() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0b0d2a'); grad.addColorStop(.6, '#1b1f4b'); grad.addColorStop(1, '#2d1b4e');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  stars.forEach(s => {
    ctx.globalAlpha = .4 + Math.abs(Math.sin(s.tw)) * .6;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  parts.forEach(p => {
    ctx.globalAlpha = Math.max(p.life / 60, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  confs.forEach(c => {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.fillRect(-c.size/2, -c.size/4, c.size, c.size/2);
    ctx.restore();
  });

  buttons = [];

  if (state === 'menu') {
    centerText('🚀 УМНОЖАЙКА', H * 0.09, Math.min(40, W / 9), '#ffe66d', true);
    centerText('Выбери уровень', H * 0.15, 22, '#ffffffcc', false);
    const bw = Math.min(320, W - 40), bh = 84, gap = 16;
    const totalH = LEVELS.length * bh + (LEVELS.length - 1) * gap;
    let y = H / 2 - totalH / 2 + 15;
    LEVELS.forEach((lv, i) => {
      const locked = i + 1 > progress.unlocked;
      const b = {
        x: W / 2 - bw / 2, y, w: bw, h: bh,
        label: locked ? '🔒 ' + lv.title : lv.title + ' · ' + lv.name,
        sub: locked ? 'Пройди предыдущий уровень' : lv.desc,
        stars: locked ? undefined : progress.stars[i],
        locked,
        color: ['#4ecdc4', '#5fa8ff', '#a29bfe', '#ff9f43', '#ff6b6b'][i],
        action: () => { if (!locked) startLevel(i); }
      };
      buttons.push(b); drawButton(b);
      y += bh + gap;
    });
  }

  if (state === 'intro') {
    const lv = LEVELS[levelIdx];
    ctx.globalAlpha = Math.min(introTimer / 20, 1, (110 - introTimer) / 15 + 1);
    centerText(lv.title, H / 2 - 90, 30, '#ffe66d', true);
    centerText(lv.name, H / 2 - 25, 46, '#fff', true);
    centerText(lv.desc, H / 2 + 40, 22, '#a9c4ff', false);
    centerText(lv.count + ' примеров без повторов', H / 2 + 82, 18, '#ffffffaa', false);
    ctx.globalAlpha = 1;
  }

  if (state === 'play' || state === 'pause') {
    const lv = LEVELS[levelIdx];
    const q = questions[qi];
    if (q) {
      const boxW = Math.min(300, W - 30), boxH = 70;
      ctx.fillStyle = '#00000055';
      roundRect(W/2 - boxW/2, 20, boxW, boxH, 18); ctx.fill();
      ctx.strokeStyle = '#ffe66d'; ctx.lineWidth = 3;
      roundRect(W/2 - boxW/2, 20, boxW, boxH, 18); ctx.stroke();
      ctx.fillStyle = '#ffe66d';
      ctx.font = 'bold 40px "Comic Sans MS", Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(q.text + ' = ?', W/2, 20 + boxH/2);
    }
    ctx.font = 'bold 19px "Comic Sans MS", Arial';
    ctx.fillStyle = '#ffd700'; ctx.textAlign = 'left';
    ctx.fillText('Счёт: ' + score + ' / ' + lv.count, 14, 34);
    if (streak >= 3) {
      ctx.fillStyle = '#ff9f43'; ctx.textAlign = 'right';
      ctx.fillText('🔥 ' + streak, W - 14, 34);
    }

    targets.forEach(t => {
      if (t.hit) return;
      const yy = t.y + Math.sin(t.wob) * 6;
      if (revealCorrect && t.glow && Math.sin(t.glow * Math.PI) > .3) {
        ctx.save(); ctx.shadowColor = '#6ee86e'; ctx.shadowBlur = 30;
      }
      ctx.beginPath();
      for (let i = 0; i < 9; i++) {
        const ang = i / 9 * Math.PI * 2;
        const rr = t.r * (0.85 + 0.13 * Math.sin(i * 2.7 + t.wob));
        const px = t.x + Math.cos(ang) * rr, py = yy + Math.sin(ang) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = t.dim ? '#3a3a4a' : (revealCorrect && t.correct ? '#2e7d4f' : '#6b5b4a');
      ctx.fill();
      ctx.strokeStyle = t.dim ? '#555' : '#8a7a68'; ctx.lineWidth = 3; ctx.stroke();
      ctx.restore();
      ctx.fillStyle = t.dim ? '#777' : '#fff';
      ctx.font = 'bold 32px "Comic Sans MS", Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.val, t.x, yy);
    });

    const rx = rocket.x, ry = rocket.y;
    ctx.save();
    ctx.fillStyle = '#ff9f43';
    ctx.beginPath();
    ctx.moveTo(rx - 10, ry + 26);
    ctx.quadraticCurveTo(rx, ry + 26 + 24 * rocket.flame + Math.random() * 6, rx + 10, ry + 26);
    ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(rx - 5, ry + 26);
    ctx.quadraticCurveTo(rx, ry + 26 + 13 * rocket.flame, rx + 5, ry + 26);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#e8e8f0';
    ctx.beginPath();
    ctx.moveTo(rx, ry - rocket.h);
    ctx.quadraticCurveTo(rx + 22, ry - 10, rx + 19, ry + 18);
    ctx.lineTo(rx - 19, ry + 18);
    ctx.quadraticCurveTo(rx - 22, ry - 10, rx, ry - rocket.h);
    ctx.fill();
    ctx.fillStyle = '#4ecdc4';
    ctx.beginPath(); ctx.arc(rx, ry - 22, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath(); ctx.moveTo(rx - 19, ry + 9); ctx.lineTo(rx - 32, ry + 27); ctx.lineTo(rx - 19, ry + 22); ctx.fill();
    ctx.beginPath(); ctx.moveTo(rx + 19, ry + 9); ctx.lineTo(rx + 32, ry + 27); ctx.lineTo(rx + 19, ry + 22); ctx.fill();

    bullets.forEach(b => {
      ctx.fillStyle = '#ffe66d';
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  if (state === 'play' && qi === 0 && score === 0) {
    ctx.font = '17px "Comic Sans MS", Arial';
    ctx.fillStyle = '#ffffff99'; ctx.textAlign = 'center';
    ctx.fillText('Води пальцем — ракета летит. Отпусти палец — выстрел 🚀', W/2, H - 26);
  }

  if (flash) {
    ctx.globalAlpha = Math.min(flash.life / 30, 1);
    ctx.font = 'bold 26px "Comic Sans MS", Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = flash.color;
    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
    ctx.fillText(flash.text, W/2, H * 0.6);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  if (state === 'levelEnd') {
    ctx.fillStyle = '#000000aa'; ctx.fillRect(0, 0, W, H);
    const lv = LEVELS[levelIdx];
    const passed = score >= lv.pass;
    centerText(passed ? '🎉 УРОВЕНЬ ПРОЙДЕН!' : '💪 НЕДОСТАТОЧНО ПОПАДАНИЙ', H/2 - 150, 32, passed ? '#ffe66d' : '#ff8a8a', true);
    centerText('Правильных ответов: ' + score + ' из ' + lv.count, H/2 - 95, 24, '#fff', false);
    const starsEarned = score === lv.count ? 3 : score > lv.pass ? 2 : score >= lv.pass ? 1 : 0;
    let s = '';
    for (let i = 0; i < 3; i++) s += i < starsEarned ? '⭐' : '☆';
    centerText(s, H/2 - 45, 38, '#ffe66d', false);
    if (!passed) centerText('Нужно хотя бы ' + lv.pass + ' правильных', H/2 - 5, 18, '#ffffffaa', false);

    // КНОПКИ — колонкой с большими промежутками, удобно для пальца
    const bw = Math.min(280, W - 60), bh = 60, gap = 24;
    let by = H/2 + 45;
    const mk = (label, color, action) => {
      const b = { x: W/2 - bw/2, y: by, w: bw, h: bh, label, color, action };
      buttons.push(b); drawButton(b);
      by += bh + gap;
    };
    if (passed && levelIdx + 1 < LEVELS.length) mk('Уровень ' + (levelIdx + 2) + ' ▶', '#6ee86e', () => startLevel(levelIdx + 1));
    mk('Ещё раз 🔁', '#4ecdc4', () => startLevel(levelIdx));
    mk('Меню 🏠', '#a29bfe', () => { state = 'menu'; });
  }
}

// ================= ЦИКЛ =================
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
